name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The integration harness's server (stack.md "Integration test harness"): PostgreSQL 16, the
    # same major as local development, pinned by digest. The runner waits for the health check
    # before the first step, and `pnpm test:integration` fails - never skips - if it is not there.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          # A throwaway credential for a container that lives for one job and listens on loopback
          # only; it guards nothing else.
          POSTGRES_PASSWORD: postgres
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A cluster administrator for the harness. 127.0.0.1 is loopback, so the harness connects
      # without TLS; any other host would require verified TLS.
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # pnpm is read from packageManager; never pin a second version here.
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The whole resolved tree, devDependencies included: an advisory reached transitively is
      # exploitable regardless of who introduced it.
      - run: pnpm audit
      - run: pnpm format:check
      - run: pnpm test:controls
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
